<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Report — SMS Scam Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0a1a;
            --surface: #13102a;
            --purple: #7c3aed;
            --purple-light: #9d5ff5;
            --purple-glow: rgba(124, 58, 237, 0.3);
            --accent: #c084fc;
            --text: #f1f0ff;
            --text-muted: #8b80b3;
            --border: rgba(124, 58, 237, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Mono', monospace;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(124,58,237,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124,58,237,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: rgba(13, 10, 26, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 60px;
            display: flex;
            align-items: center;
        }

        .nav-inner {
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 16px;
            text-decoration: none;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links a {
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover { color: var(--text); }

        .nav-links .nav-btn {
            background: var(--purple);
            color: #fff;
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 13px;
        }

        .nav-links .nav-btn:hover { background: var(--purple-light); color: #fff; }

        .container {
            position: relative;
            z-index: 1;
            max-width: 680px;
            margin: 0 auto;
            padding: 90px 24px 80px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 24px;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--text); }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(124,58,237,0.15);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 5px 14px;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 16px;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 28px;
        }

        .flash {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .flash.error   { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.3);  color: #ef4444; }
        .flash.success { background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.3);  color: #22c55e; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.6s ease both;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--purple-light), transparent);
        }

        .form-group { margin-bottom: 22px; }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            font-family: 'DM Mono', monospace;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px var(--purple-glow);
        }

        textarea { height: 160px; resize: none; line-height: 1.6; }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        button[type="submit"] {
            flex: 1;
            padding: 13px;
            background: var(--purple);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }

        button[type="submit"]:hover {
            background: var(--purple-light);
            box-shadow: 0 0 24px var(--purple-glow);
        }

        .btn-cancel {
            flex: 1;
            padding: 13px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: color 0.2s, border-color 0.2s;
        }

        .btn-cancel:hover {
            color: var(--text);
            border-color: var(--purple);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-inner">
        <a href="/" class="nav-logo">SMS Scam Detector</a>
        <div class="nav-links">
            <a href="/community">Community</a>
            <a href="/report">Report Scam</a>
            <a href="/admin">Admin</a>
            <a href="/logout" class="nav-btn">Logout ({{ session.get('username') }})</a>
        </div>
    </div>
</nav>

<div class="container">

    <a href="/admin" class="back-link">← Back to Dashboard</a>

    <div class="badge">Admin — Edit Report</div>
    <h1>Edit Report</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <div class="card">
        <form method="POST" action="/admin/edit/{{ report.id }}">

            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" value="{{ report.title }}" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" required>{{ report.description }}</textarea>
            </div>

            <div class="form-group">
                <label>Admin Note</label>
                <textarea name="admin_note" style="height:90px;" placeholder="Add context or corrections...">{{ report.admin_note or '' }}</textarea>
            </div>

            <div class="btn-row">
                <a href="/admin" class="btn-cancel">Cancel</a>
                <button type="submit">Save Changes</button>
            </div>

        </form>
    </div>

</div>
</body>
</html>
